<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>VitalTrack — Mode Hors-Ligne</title>
  <link rel="stylesheet" href="/static/modules/tailwind.min.css?v=1.0.0">
  <link rel="stylesheet" href="/static/modules/theme.css?v=1.0.0">
</head>
<body class="bg-[#0B0F17] text-slate-100 min-h-screen flex flex-col items-center justify-center p-6 text-center">
  <div class="max-w-md w-full bg-[#151D2A] border border-[#1F2A3C] rounded-2xl p-8 space-y-6 shadow-2xl">
    <div class="w-16 h-16 rounded-2xl bg-gradient-to-tr from-brand-600 to-electric-cyan flex items-center justify-center mx-auto shadow-lg shadow-brand-500/20 text-white">
      <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 0a5 5 0 010-7.072M3 3l18 18M3 10.5a9 9 0 0112.728-4.864"></path>
      </svg>
    </div>
    <div class="space-y-2">
      <h1 class="text-xl font-bold text-white tracking-tight">Mode Hors-Ligne</h1>
      <p class="text-sm text-slate-300">
        Vous n'êtes pas connecté à Internet. Vos données enregistrées localement restent accessibles.
      </p>
    </div>
    <div class="pt-2">
      <button onclick="window.location.reload()" class="w-full py-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-500 text-white font-semibold text-sm transition-all shadow-md shadow-brand-600/20 active:scale-95">
        Réessayer la connexion
      </button>
    </div>
  </div>
</body>
</html>
