name: Build & Release Android APK (VitalTrack Health Bridge)

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
    paths:
      - 'android/**'
      - '.github/workflows/build-android-bridge.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Compile & Sign Android Bridge APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build APK (Assemble Debug)
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          cd android/health-bridge-app
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug --stacktrace

      - name: Package & Prepare Installable APK
        run: |
          mkdir -p output-apk
          APK_PATH=$(find android/health-bridge-app/app/build/outputs/apk/ -name "*.apk" | head -n 1)
          if [ -n "$APK_PATH" ] && [ -f "$APK_PATH" ]; then
            echo "Found APK: $APK_PATH"
            cp "$APK_PATH" output-apk/vitaltrack-health-bridge.apk
          else
            echo "ERROR: No APK found after build!"
            exit 1
          fi

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: vitaltrack-health-bridge-apk
          path: output-apk/vitaltrack-health-bridge.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish or Update GitHub Release
        if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && github.repository == 'TheBigBad31/VitalTrack'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: VitalTrack Android Health Bridge (APK Officiel)
          body: |
            ## 📱 Passerelle Android VitalTrack Health Bridge (Google Health Connect)

            Cet APK installable directement sur smartphone Android / Xiaomi (HyperOS & MIUI) permet de synchroniser en continu les métriques locales de Google Health Connect (RingConn Gen 3, Withings, pas, sommeil, FC) vers votre serveur VitalTrack.

            ### 📦 Téléchargement :
            - **Fichier** : `vitaltrack-health-bridge.apk`
          files: output-apk/vitaltrack-health-bridge.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
