name: CI Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-quality:
    uses: ./.github/workflows/reusable-python-quality.yml
    with:
      python-version: '3.11'
      working-directory: '.'
      run-lint: true
      run-tests: true

  frontend-check:
    uses: ./.github/workflows/reusable-frontend-check.yml
    with:
      node-version: '20'
      js-glob: 'static/modules/*.js'

  lighthouse-audit:
    name: Lighthouse Performance Budget
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Lighthouse CI CLI
        run: |
          npm install -g @lhci/cli@0.14.x

      - name: Run Lighthouse CI (Audit & Budget Assertions)
        run: |
          lhci autorun --config=./lighthouserc.json

  vercel-smoke-test:
    uses: ./.github/workflows/reusable-vercel-smoke.yml
    with:
      target-url: 'https://vital-track-one.vercel.app'
      health-path: '/api/health'