[project]
name = "vitaltrack"
version = "0.1.0"
description = "Plateforme de suivi du poids, nutrition photo IA et objets connectés de santé"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "psycopg[binary]>=3.1.18",
    "psycopg_pool>=3.2.0",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]

