[project]
name = "vitaltrack"
version = "0.1.0"
description = "Plateforme de suivi du poids, nutrition photo IA et objets connectés de santé"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "psycopg[binary]>=3.1.18",
    "psycopg_pool>=3.2.0",
    "alembic>=1.13.0",
    "pyjwt>=2.8.0",
    "bcrypt>=5.0.0",
    "cryptography>=50.0.2",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "pip-audit>=2.7.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "--strict-markers"

# --- Lint (ruff) ---------------------------------------------------------
# `ruff check` applique la sélection ci-dessous (rapport complet, non bloquant
# en CI). Le garde-fou bloquant de la CI cible explicitement les erreurs
# critiques via `ruff check --select E9,F63,F7,F82`.
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = [".venv", ".ci-venv", "build", "android", "data"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

# --- Typage (mypy) ------------------------------------------------------
# Le nombre d'erreurs est plafonné par `.github/mypy-baseline.txt` (ratchet) :
# la CI échoue si le total augmente, et signale toute amélioration.
[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
check_untyped_defs = false
show_error_codes = true

[[tool.mypy.overrides]]
module = ["tests.*"]
ignore_errors = true

# --- Couverture (pytest-cov) --------------------------------------------
# Le seuil bloquant est passé en CLI par la CI (--cov-fail-under).
[tool.coverage.run]
source = ["src"]
branch = false

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[dependency-groups]
dev = [
    "fastapi>=0.144.0",
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "uvicorn>=0.54.0",
]

